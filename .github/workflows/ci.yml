name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run catches breakage from new releases of php-parser, PHPUnit, solc and PHP itself.
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  composer-validate:
    name: composer.json is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer validate --strict

  tests:
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }} deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        dependencies: [lowest, highest]
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.dependencies }}-

      - name: Install dependencies (lowest)
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --no-interaction --no-progress

      - name: Install dependencies (highest)
        if: matrix.dependencies == 'highest'
        run: composer update --prefer-stable --no-interaction --no-progress

      - name: Unit and golden tests
        run: vendor/bin/phpunit

  tests-os:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer update --prefer-stable --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - name: CLI smoke test
        run: |
          php bin/phpsolidity compile examples --output build/solidity
          php bin/phpsolidity validate examples tests/fixtures/contracts
          php bin/phpsolidity ast examples/MyToken.php

  static-analysis:
    name: PHPStan and security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer update --prefer-stable --no-interaction --no-progress
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M
      - run: composer audit

  solidity:
    name: Generated Solidity compiles (solc ${{ matrix.solc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        solc: ['0.8.20', '0.8.26', '0.8.28']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: composer update --prefer-stable --no-interaction --no-progress
      - name: Transpile every fixture and example
        run: php bin/phpsolidity compile tests/fixtures/contracts examples --output build/solidity --quiet
      - name: Install solc-js ${{ matrix.solc }}
        working-directory: scripts
        run: npm install --no-save --no-package-lock solc@${{ matrix.solc }}
      - name: Compile the generated Solidity
        run: node scripts/solc-check.js build/solidity
      - name: Compile the committed golden files
        run: node scripts/solc-check.js tests/fixtures/expected

  install-as-dependency:
    name: Works when installed with Composer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Create a project that depends on this checkout
        run: |
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          composer init --name=ci/consumer --no-interaction
          composer config minimum-stability dev
          composer config repositories.local "{\"type\":\"path\",\"url\":\"$GITHUB_WORKSPACE\",\"options\":{\"symlink\":false}}"
          composer require danielmabadeje/php-solidity:@dev --no-interaction
          mkdir contracts && cp "$GITHUB_WORKSPACE/examples/MyToken.php" contracts/
          vendor/bin/phpsolidity compile contracts --output out
          test -s out/MyToken.sol
      - name: The stubs must not be autoloaded into the consumer
        run: |
          cd "$RUNNER_TEMP/consumer"
          php -r 'require "vendor/autoload.php"; exit(class_exists("Event", false) || class_exists("address", false) ? 1 : 0);'

  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: php scripts/check-docs.php
